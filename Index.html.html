<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Melon Scanner</title>

<!-- iOS "Add to Home Screen" behaviour -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Melon Scanner" />
<meta name="theme-color" content="#151f18" />

<style>
  html, body, #root { margin: 0; padding: 0; background: #151f18; height: 100%; }
  * { -webkit-tap-highlight-color: transparent; }
</style>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useRef, useEffect, useState, useCallback } = React;

// ---------- Heuristic "grading" engine (no ML — pure pixel math) ----------

function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  let h, s, l = (max + min) / 2;
  if (max === min) { h = s = 0; }
  else {
    const d = max - min;
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    switch (max) {
      case r: h = (g - b) / d + (g < b ? 6 : 0); break;
      case g: h = (b - r) / d + 2; break;
      default: h = (r - g) / d + 4;
    }
    h *= 60;
  }
  return [h, s, l];
}

function isProduceHue(h, s, l) {
  if (s < 0.15 || l < 0.08 || l > 0.95) return false;
  const green = h >= 55 && h <= 165;
  const pink = h >= 330 || h <= 15;
  const gold = h > 15 && h < 55;
  return green || pink || gold;
}

function classifyHue(h) {
  if (h >= 55 && h <= 165) return 'green';
  if (h >= 330 || h <= 15) return 'pink';
  return 'gold';
}

const GRID_W = 64, GRID_H = 48;

function analyzeFrame(ctx, videoW, videoH) {
  const off = analyzeFrame._off || (analyzeFrame._off = document.createElement('canvas'));
  off.width = GRID_W; off.height = GRID_H;
  const octx = off.getContext('2d', { willReadFrequently: true });
  octx.drawImage(ctx.canvas, 0, 0, videoW, videoH, 0, 0, GRID_W, GRID_H);
  const { data } = octx.getImageData(0, 0, GRID_W, GRID_H);

  const mask = new Uint8Array(GRID_W * GRID_H);
  const hues = new Float32Array(GRID_W * GRID_H);
  const lights = new Float32Array(GRID_W * GRID_H);

  for (let i = 0; i < GRID_W * GRID_H; i++) {
    const r = data[i * 4], g = data[i * 4 + 1], b = data[i * 4 + 2];
    const [h, s, l] = rgbToHsl(r, g, b);
    hues[i] = h; lights[i] = l;
    mask[i] = isProduceHue(h, s, l) ? 1 : 0;
  }

  const visited = new Uint8Array(GRID_W * GRID_H);
  let best = null;
  const stack = [];
  for (let y = 0; y < GRID_H; y++) {
    for (let x = 0; x < GRID_W; x++) {
      const idx = y * GRID_W + x;
      if (!mask[idx] || visited[idx]) continue;
      let minX = x, maxX = x, minY = y, maxY = y, count = 0;
      stack.push(idx); visited[idx] = 1;
      const members = [];
      while (stack.length) {
        const cur = stack.pop();
        const cy = (cur / GRID_W) | 0, cx = cur % GRID_W;
        count++; members.push(cur);
        if (cx < minX) minX = cx; if (cx > maxX) maxX = cx;
        if (cy < minY) minY = cy; if (cy > maxY) maxY = cy;
        const neighbors = [cur - 1, cur + 1, cur - GRID_W, cur + GRID_W];
        for (const n of neighbors) {
          if (n < 0 || n >= GRID_W * GRID_H) continue;
          if (cx === 0 && n === cur - 1) continue;
          if (cx === GRID_W - 1 && n === cur + 1) continue;
          if (!visited[n] && mask[n]) { visited[n] = 1; stack.push(n); }
        }
      }
      if (count >= 40 && (!best || count > best.count)) {
        best = { minX, maxX, minY, maxY, count, members };
      }
    }
  }

  if (!best) return null;

  const memberHues = best.members.map(i => hues[i]);
  const memberLights = best.members.map(i => lights[i]);
  const dominantHue = classifyHue(median(memberHues));

  const hueVar = stddev(memberHues);
  const lightVar = stddev(memberLights);

  const midX = (best.minX + best.maxX) / 2;
  let leftSum = 0, leftN = 0, rightSum = 0, rightN = 0;
  for (const i of best.members) {
    const cx = i % GRID_W;
    if (cx < midX) { leftSum += lights[i]; leftN++; }
    else { rightSum += lights[i]; rightN++; }
  }
  const leftAvg = leftN ? leftSum / leftN : 0;
  const rightAvg = rightN ? rightSum / rightN : 0;
  const symmetryDelta = Math.abs(leftAvg - rightAvg);

  const evenness = clamp(100 - hueVar * 9, 0, 100);
  const sheen = clamp(100 - lightVar * 260, 0, 100);
  const symmetry = clamp(100 - symmetryDelta * 340, 0, 100);
  const size = clamp(best.count / (GRID_W * GRID_H) * 260, 0, 100);

  const overall = clamp(evenness * 0.35 + sheen * 0.25 + symmetry * 0.25 + size * 0.15, 0, 100);

  return {
    box: {
      x: best.minX / GRID_W, y: best.minY / GRID_H,
      w: (best.maxX - best.minX + 1) / GRID_W, h: (best.maxY - best.minY + 1) / GRID_H,
    },
    dominantHue,
    scores: { evenness, sheen, symmetry, size },
    overall,
  };
}

function median(arr) {
  const s = [...arr].sort((a, b) => a - b);
  return s[Math.floor(s.length / 2)] || 0;
}
function stddev(arr) {
  if (!arr.length) return 0;
  const m = arr.reduce((a, b) => a + b, 0) / arr.length;
  return Math.sqrt(arr.reduce((a, b) => a + (b - m) ** 2, 0) / arr.length);
}
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function commentsFor(result) {
  const { scores, overall, dominantHue } = result;
  const lines = [];
  const kind = dominantHue === 'green' ? 'rind' : dominantHue === 'gold' ? 'skin' : 'flesh';

  if (scores.evenness > 70) lines.push(`Even ${kind} tone — good sign of consistent ripening.`);
  else if (scores.evenness > 40) lines.push(`Some ${kind} mottling — check the rest of the batch.`);
  else lines.push(`Patchy ${kind} colour — may be under or over-ripe.`);

  if (scores.symmetry > 70) lines.push('Well-balanced, symmetrical shape.');
  else if (scores.symmetry > 40) lines.push('Slightly lopsided shape — usually still fine.');
  else lines.push('Noticeably uneven shape — irregular growth.');

  if (scores.sheen > 65) lines.push('Smooth, low-glare surface — often a good sign.');
  else lines.push('Glossy or blemished patches detected — inspect closely.');

  let verdict = 'Worth a closer look';
  if (overall > 72) verdict = 'Strong pick';
  else if (overall > 50) verdict = 'Decent, not the best in frame';
  else verdict = 'Keep scanning for a better one';

  return { verdict, lines };
}

// ---------- UI ----------

const PALETTE = {
  bg: '#151f18', panel: '#1f2e24', panelBorder: '#33473a',
  cream: '#f3efe6', sage: '#8ba58f', coral: '#ff6b5b', gold: '#e8b94d', dim: '#5d7365',
};

function ScoreBars({ scores }) {
  const rows = [
    ['Colour evenness', scores.evenness],
    ['Shape symmetry', scores.symmetry],
    ['Surface sheen', scores.sheen],
    ['Fill of frame', scores.size],
  ];
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
      {rows.map(([label, val]) => (
        <div key={label} style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          <div style={{ width: 108, fontSize: 10.5, color: PALETTE.dim }}>{label}</div>
          <div style={{ flex: 1, height: 5, background: '#0f1712', borderRadius: 4, overflow: 'hidden' }}>
            <div style={{
              width: `${val}%`, height: '100%',
              background: val > 65 ? PALETTE.sage : val > 40 ? PALETTE.gold : PALETTE.coral,
              transition: 'width 0.2s ease-out',
            }} />
          </div>
          <div style={{ width: 26, fontSize: 10.5, fontFamily: "'Courier New', monospace", textAlign: 'right', color: PALETTE.cream }}>
            {Math.round(val)}
          </div>
        </div>
      ))}
    </div>
  );
}

function MelonScanner() {
  const videoRef = useRef(null);
  const canvasRef = useRef(null);
  const rafRef = useRef(null);
  const [ready, setReady] = useState(false);
  const [error, setError] = useState(null);
  const [result, setResult] = useState(null);
  const [best, setBest] = useState(null);
  const [scanning, setScanning] = useState(true);
  const lastGoodRef = useRef(0);

  useEffect(() => {
    let stream;
    (async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false,
        });
        if (videoRef.current) {
          videoRef.current.srcObject = stream;
          await videoRef.current.play();
          setReady(true);
        }
      } catch (e) {
        setError(e.message || 'Camera access was denied.');
      }
    })();
    return () => {
      if (stream) stream.getTracks().forEach(t => t.stop());
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
  }, []);

  const loop = useCallback(() => {
    const video = videoRef.current, canvas = canvasRef.current;
    if (video && canvas && video.readyState >= 2 && scanning) {
      const w = canvas.width = video.videoWidth;
      const h = canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, w, h);

      const now = performance.now();
      if (now - lastGoodRef.current > 220) {
        lastGoodRef.current = now;
        const r = analyzeFrame(ctx, w, h);
        setResult(r);
        if (r && (!best || r.overall > best.overall)) setBest(r);
      }
    }
    rafRef.current = requestAnimationFrame(loop);
  }, [scanning, best]);

  useEffect(() => {
    rafRef.current = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(rafRef.current);
  }, [loop]);

  const comment = result ? commentsFor(result) : null;
  const scoreColor = !result ? PALETTE.dim
    : result.overall > 72 ? PALETTE.sage
    : result.overall > 50 ? PALETTE.gold
    : PALETTE.coral;

  return (
    <div style={{
      minHeight: '100vh', background: PALETTE.bg, color: PALETTE.cream,
      fontFamily: "'Georgia', 'Iowan Old Style', serif",
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      padding: '18px 12px 28px', boxSizing: 'border-box',
    }}>
      <style>{`
        @keyframes pulseRing { 0% { box-shadow: 0 0 0 0 rgba(232,185,77,0.55); } 100% { box-shadow: 0 0 0 14px rgba(232,185,77,0); } }
        @keyframes sweep { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .ticket-line { animation: fadeIn 0.35s ease both; }
      `}</style>

      <div style={{ textAlign: 'center', marginBottom: 14 }}>
        <div style={{ fontSize: 11, letterSpacing: '0.24em', color: PALETTE.sage, textTransform: 'uppercase' }}>
          Field Grading Demo
        </div>
        <h1 style={{ margin: '4px 0 0', fontSize: 22, fontWeight: 700, letterSpacing: '0.01em' }}>
          Melon Scanner
        </h1>
        <div style={{ fontSize: 12.5, color: PALETTE.dim, marginTop: 2, maxWidth: 320 }}>
          Heuristic colour &amp; shape analysis — no AI model, just pixel math, live from your camera.
        </div>
      </div>

      <div style={{
        position: 'relative', width: '100%', maxWidth: 420, aspectRatio: '3/4',
        borderRadius: 18, overflow: 'hidden', background: '#000',
        border: `1px solid ${PALETTE.panelBorder}`,
      }}>
        <video ref={videoRef} playsInline muted style={{
          position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover',
        }} />
        <canvas ref={canvasRef} style={{ display: 'none' }} />

        {!ready && !error && (
          <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 13, color: PALETTE.sage }}>
            Requesting camera…
          </div>
        )}
        {error && (
          <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', textAlign: 'center', padding: 20, fontSize: 13, color: PALETTE.coral }}>
            Camera unavailable: {error}
          </div>
        )}

        {result && (
          <div style={{
            position: 'absolute',
            left: `${result.box.x * 100}%`,
            top: `${result.box.y * 100}%`,
            width: `${result.box.w * 100}%`,
            height: `${result.box.h * 100}%`,
            border: `2px solid ${scoreColor}`,
            borderRadius: 10,
            transition: 'all 0.18s ease-out',
          }}>
            <div style={{
              position: 'absolute', top: -13, left: 8, padding: '2px 8px',
              background: scoreColor, color: '#151f18', fontSize: 11, fontWeight: 700,
              borderRadius: 20, fontFamily: "'Courier New', monospace",
            }}>
              {Math.round(result.overall)}
            </div>
            <div style={{
              position: 'absolute', inset: -2, borderRadius: 12,
              animation: 'pulseRing 1.6s ease-out infinite',
            }} />
          </div>
        )}

        {ready && !result && (
          <div style={{ position: 'absolute', inset: 0, overflow: 'hidden', pointerEvents: 'none' }}>
            <div style={{
              position: 'absolute', left: 0, right: 0, height: '30%',
              background: 'linear-gradient(180deg, rgba(232,185,77,0) 0%, rgba(232,185,77,0.14) 50%, rgba(232,185,77,0) 100%)',
              animation: 'sweep 2.6s linear infinite',
            }} />
          </div>
        )}

        <div style={{
          position: 'absolute', bottom: 10, left: 10, right: 10,
          display: 'flex', justifyContent: 'space-between', fontSize: 10.5,
          color: 'rgba(243,239,230,0.75)', letterSpacing: '0.06em', fontFamily: "'Courier New', monospace",
        }}>
          <span>{result ? result.dominantHue.toUpperCase() + ' MATCH' : 'SEARCHING'}</span>
          <span>{scanning ? 'LIVE' : 'PAUSED'}</span>
        </div>
      </div>

      <div style={{
        width: '100%', maxWidth: 420, marginTop: 14,
        background: PALETTE.panel, border: `1px solid ${PALETTE.panelBorder}`,
        borderRadius: 14, padding: '14px 16px',
      }}>
        {!result ? (
          <div style={{ fontSize: 13, color: PALETTE.dim, textAlign: 'center', padding: '6px 0' }}>
            Point the camera at a melon to begin grading.
          </div>
        ) : (
          <>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 8 }}>
              <div style={{ fontSize: 15, fontWeight: 700 }}>{comment.verdict}</div>
              <div style={{ fontFamily: "'Courier New', monospace", fontSize: 13, color: scoreColor }}>
                {Math.round(result.overall)}/100
              </div>
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 4, marginBottom: 10 }}>
              {comment.lines.map((l, i) => (
                <div key={i} className="ticket-line" style={{ fontSize: 12.5, color: PALETTE.cream, opacity: 0.9 }}>
                  · {l}
                </div>
              ))}
            </div>
            <ScoreBars scores={result.scores} />
          </>
        )}

        {best && (
          <div style={{
            marginTop: 12, paddingTop: 10, borderTop: `1px dashed ${PALETTE.panelBorder}`,
            display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: 12,
          }}>
            <span style={{ color: PALETTE.sage }}>Best seen this session</span>
            <span style={{ fontFamily: "'Courier New', monospace", color: PALETTE.gold }}>{Math.round(best.overall)}/100</span>
          </div>
        )}
      </div>

      <button
        onClick={() => setScanning(s => !s)}
        style={{
          marginTop: 14, padding: '9px 20px', borderRadius: 24,
          background: 'transparent', border: `1px solid ${PALETTE.sage}`,
          color: PALETTE.sage, fontSize: 12.5, letterSpacing: '0.04em',
          cursor: 'pointer',
        }}
      >
        {scanning ? 'Pause scanning' : 'Resume scanning'}
      </button>

      <div style={{ fontSize: 10.5, color: PALETTE.dim, marginTop: 16, maxWidth: 340, textAlign: 'center', lineHeight: 1.5 }}>
        Prototype only: grades are estimated from on-screen colour evenness, shape symmetry, and surface sheen —
        not a substitute for a real ripeness check.
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<MelonScanner />);
</script>
</body>
</html>
